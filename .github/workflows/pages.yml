# Publishes the PWA to GitHub Pages so it can be opened on an iPhone and added to the Home Screen.
# Requires Pages "Source: GitHub Actions" in the repository settings.
name: Deploy to GitHub Pages
on:
  push:
    branches: [claude/forge-empires-city-optimizer-qz6eo0]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
